<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Focus Desk Clock</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <main id="app">

    <!-- Live date and time pill -->
    <header class="top">
      <button id="btnStats" class="icon-btn left" aria-label="Daily stats">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V11M12 20V4M18 20v-6"/></svg>
      </button>
      <div id="pill" class="pill">
        <span id="pillDate">---</span>
        <span id="pillTime">--:--:--</span>
      </div>
      <button id="btnHelp" class="icon-btn help" aria-label="How to use">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>
      </button>
      <button id="btnFull" class="icon-btn" aria-label="Full screen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </header>

    <!-- Mode switcher -->
    <nav class="modes" aria-label="Mode">
      <button class="mode active" data-mode="clock">Clock</button>
      <button class="mode" data-mode="timer">Timer</button>
      <button class="mode" data-mode="stopwatch">Stopwatch</button>
    </nav>

    <!-- Main big display -->
    <section class="stage">
      <div id="sessionLabel" class="label">DESK CLOCK</div>
      <div id="display" class="display">00:00</div>
    </section>

    <!-- Controls -->
    <section id="controls" class="controls">
      <button id="btnSet">Set</button>
      <button id="btnChange">Change</button>
      <button id="btnClear">Clear</button>
      <button id="btnStart" class="primary">Start</button>
    </section>

    <!-- Bottom information -->
    <footer class="info">
      <div>TOTAL <b id="infoTotal">--</b></div>
      <div>ENDING AT <b id="infoEnd">--</b></div>
      <div>COMPLETED <b id="infoDone">0</b></div>
      <div>SCREEN AWAKE <b id="infoAwake">--</b></div>
      <div id="infoBatteryWrap" hidden>BATTERY <b id="infoBattery">--</b></div>
    </footer>

  </main>
  <!-- Set countdown panel -->
  <div id="setPanel" class="overlay" hidden>
    <div class="sheet">
      <div class="picker">
        <div class="col">
          <button class="step" data-unit="h" data-dir="1">&#9650;</button>
          <div id="numH" class="num">00</div>
          <button class="step" data-unit="h" data-dir="-1">&#9660;</button>
          <div class="unit">HOURS</div>
        </div>
        <div class="colon">:</div>
        <div class="col">
          <button class="step" data-unit="m" data-dir="1">&#9650;</button>
          <div id="numM" class="num">25</div>
          <button class="step" data-unit="m" data-dir="-1">&#9660;</button>
          <div class="unit">MINUTES</div>
        </div>
        <div class="colon">:</div>
        <div class="col">
          <button class="step" data-unit="s" data-dir="1">&#9650;</button>
          <div id="numS" class="num">00</div>
          <button class="step" data-unit="s" data-dir="-1">&#9660;</button>
          <div class="unit">SECONDS</div>
        </div>
      </div>
      <div class="side">
        <div class="label">QUICK PICK</div>
        <div class="chips">
          <button class="chip" data-min="5">5 min</button>
          <button class="chip" data-min="15">15 min</button>
          <button class="chip" data-min="25">25 min</button>
          <button class="chip" data-min="45">45 min</button>
          <button class="chip" data-min="60">60 min</button>
          <button class="chip" data-min="120">120 min</button>
        </div>
        <div class="sheet-actions">
          <button id="setCancel">Cancel</button>
          <button id="setOk" class="primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Daily stats panel -->
  <div id="statsPanel" class="overlay" hidden>
    <div class="stats-card">
      <div class="label">TODAY</div>
      <div class="stats-grid">
        <div><b id="stFocus">0</b><span>FOCUS SESSIONS</span></div>
        <div><b id="stTime">00:00:00</b><span>TIME FOCUSED</span></div>
        <div><b id="stBreaks">0</b><span>BREAKS</span></div>
      </div>
      <div class="sheet-actions">
        <button id="statsReset">Reset today</button>
        <button id="statsClose" class="primary">Close</button>
      </div>
    </div>
  </div>

  <!-- Welcome tour -->
  <div id="tour" class="overlay" hidden>
    <div class="tour-card">
      <div id="tourStep" class="label">1 / 4</div>
      <h2 id="tourTitle" class="tour-title"></h2>
      <p id="tourText" class="tour-text"></p>
      <a id="tourLink" class="tour-link" href="#" target="_blank" rel="noopener" aria-label="Open the project on GitHub" hidden>
        <svg viewBox="0 0 16 16" width="44" height="44" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <div id="tourDots" class="tour-dots"></div>
      <div class="sheet-actions">
        <button id="tourSkip">Skip</button>
        <button id="tourNext" class="primary">Next</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
